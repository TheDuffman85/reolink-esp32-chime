# Push a tag exactly matching firmware/version.json (e.g. 1.0.24). CHANGELOG.md
# must contain a non-empty section for that version; it becomes the release notes.
name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check tag matches firmware version
        id: version
        run: |
          version=$(python3 tools/version.py)
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match firmware/version.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          mkdir -p ../release-notes
          python3 tools/changelog.py "$GITHUB_REF_NAME" > ../release-notes/changelog.md

      - name: Install build and test dependencies
        run: |
          python3 -m pip install 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
          python3 -m pip install 'certifi>=2026.10.19'
          python3 -m pip install platformio==6.2.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libssl-dev

      - name: Build firmware
        run: pio run -e esp32dev -t build_initial

      - name: Run host tests and fuzz corpus
        run: bash tools/test.sh

      - name: Package OTA and initial USB firmware
        run: python3 tools/package.py

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware/dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes

      - name: Create release
        run: |
          cp notes/changelog.md release-notes.md
          printf '\n### Installation\n\n' >> release-notes.md
          cat >> release-notes.md <<'EOF'
          - Upload `firmware.bin` through Settings → Firmware for an OTA update.
          - For initial USB installation, flash `firmware-initial.bin` at address `0x0` using esptool. It includes the bootloader, partition table, OTA boot data and app; no PlatformIO build is required. Flashing this merged image clears stored settings. Do not upload it through the web updater.
          - `manifest.json` contains the firmware version, both image SHA-256 hashes and source hashes.
          EOF
          printf '\n[USB flashing instructions](https://github.com/%s/blob/%s/firmware/README.md#initial-usb-installation-from-a-release)\n' "$GH_REPO" "$VERSION" >> release-notes.md
          printf '\n[Install over USB from your browser](https://%s.github.io/%s/) (clears saved settings and pairing; available after the Pages deployment finishes).\n' "${GH_REPO%%/*}" "${GH_REPO#*/}" >> release-notes.md
          gh release create "$VERSION" dist/firmware.bin dist/firmware-initial.bin dist/manifest.json \
            --verify-tag \
            --title "$VERSION" \
            --notes-file release-notes.md
